server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: неизвестные пути отдаём в index.html, чтобы работал
    # react-router (иначе прямой заход на /rules и т.п. даёт 404 от nginx).
    location / {
        try_files $uri /index.html;
    }
}
